[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen-42"
version = "1.0.0"
description = "Reusable maze generator with 42 pattern"
authors = [{name="maqlil"}, {name="mgamal"}]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen"]
